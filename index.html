<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Rak Ceria — Perpustakaan Anak</title>
    <meta name="robots" content="noindex, nofollow" />
    <title>Rak Ceria — Perpustakaan Anak</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eaf6fb;
        --bg-2: #ffffff;
        --ink: #1f2a37;
        --ink-soft: #55606b;
        --wood: #c98a4b;
        --wood-dark: #a8672e;
        --coral: #ff6b5b;
        --sun: #ffc94a;
        --leaf: #3fa875;
        --sky: #3e8eed;
        --berry: #9b5de5;
        --card-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
        --radius: 14px;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #132330;
          --bg-2: #1b3040;
          --ink: #f1f5f8;
          --ink-soft: #b9c6d0;
        }
      }
      :root[data-theme="dark"] {
        --bg: #132330;
        --bg-2: #1b3040;
        --ink: #f1f5f8;
        --ink-soft: #b9c6d0;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(rgba(62, 142, 237, 0.12) 1px, transparent 1px),
          linear-gradient(135deg, rgba(255, 201, 74, 0.08), transparent 42%);
        background-size:
          18px 18px,
          100% 100%;
        color: var(--ink);
        font-family: "Nunito", sans-serif;
        -webkit-font-smoothing: antialiased;
        animation: page-enter 0.7s ease both;
      }
      h1,
      h2,
      h3,
      .heading {
        font-family: "Baloo 2", sans-serif;
      }

      header.hero {
        padding: 28px 20px 22px;
        background: url("revisi background.png") center / cover no-repeat;
        color: #fff;
        border-bottom-left-radius: 32px;
        border-bottom-right-radius: 32px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 0 rgba(62, 142, 237, 0.12);
      }
      header.hero::after {
        content: "📚 🎈 🚀 🦄";
        position: absolute;
        right: -10px;
        bottom: -18px;
        font-size: 34px;
        opacity: 0.25;
        letter-spacing: 8px;
        animation: hero-decor 8s ease-in-out infinite alternate;
      }
      .hero-inner {
        max-width: 980px;
        margin: 0 auto;
        position: relative;
      }
      .brand-logo {
        display: block;
        width: min(180px, 48vw);
        height: auto;
        margin-bottom: 12px;
        border-radius: 12px;
        background: #fff;
        padding: 6px;
        animation: logo-enter 0.7s 0.1s ease both;
      }
      .hero h1 {
        font-size: clamp(28px, 5vw, 42px);
        margin: 0 0 6px;
        font-weight: 800;
        animation: content-enter 0.6s 0.22s ease both;
      }
      .hero p {
        margin: 0;
        font-size: 16px;
        opacity: 0.95;
        max-width: 520px;
        line-height: 1.5;
        animation: content-enter 0.6s 0.32s ease both;
      }
      .hero-badge {
        display: inline-block;
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        animation: content-enter 0.6s 0.42s ease both;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(6px);
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 22px 20px 60px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 18px;
      }
      .search-box {
        flex: 1 1 220px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-2);
        border: 2px solid rgba(62, 142, 237, 0.16);
        border-radius: 999px;
        padding: 10px 16px;
        box-shadow: var(--card-shadow);
        transition:
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }
      .search-box:focus-within {
        transform: translateY(-2px);
        box-shadow: 0 9px 0 rgba(0, 0, 0, 0.08);
      }
      .search-box input {
        border: none;
        outline: none;
        background: transparent;
        width: 100%;
        font-family: "Nunito", sans-serif;
        font-size: 15px;
        color: var(--ink);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: none;
        cursor: pointer;
        padding: 9px 15px;
        border-radius: 999px;
        font-family: "Nunito", sans-serif;
        font-weight: 700;
        font-size: 13.5px;
        background: var(--bg-2);
        color: var(--ink-soft);
        box-shadow: var(--card-shadow);
        transition: transform 0.12s ease;
      }
      .chip:hover {
        transform: translateY(-2px);
      }
      .chip.active {
        background: var(--leaf);
        color: #fff;
        box-shadow: 0 4px 0 rgba(63, 168, 117, 0.25);
      }

      section.shelf-section {
        margin-bottom: 30px;
      }
      .shelf-title {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .shelf-title::after {
        content: "";
        height: 6px;
        flex: 1;
        margin-left: 6px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          var(--wood),
          rgba(201, 138, 75, 0.08)
        );
      }

      .my-books {
        background: var(--bg-2);
        border-left: 6px solid var(--coral);
        border-radius: var(--radius);
        padding: 16px 18px;
        box-shadow: var(--card-shadow);
        margin-bottom: 26px;
      }
      .my-books h2 {
        margin: 0 0 10px;
        font-size: 19px;
      }
      .my-books-empty {
        color: var(--ink-soft);
        font-size: 14.5px;
        margin: 0;
      }
      .loan-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-top: 1px dashed rgba(0, 0, 0, 0.1);
      }
      .loan-row:first-of-type {
        border-top: none;
      }
      .loan-info {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .loan-title {
        font-weight: 700;
        font-size: 14.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .loan-due {
        font-size: 12.5px;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .return-btn {
        border: none;
        background: var(--coral);
        color: #fff;
        font-weight: 700;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 13px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px 14px;
        padding-bottom: 14px;
        border-bottom: 10px solid var(--wood);
        border-image: linear-gradient(180deg, var(--wood), var(--wood-dark)) 1;
      }
      .book {
        background: var(--bg-2);
        border-radius: 10px 10px 4px 4px;
        box-shadow: var(--card-shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: book-enter 0.55s ease both;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .book:hover {
        transform: translateY(-6px) rotate(-0.5deg);
        box-shadow: 0 12px 0 rgba(0, 0, 0, 0.1);
      }
      .book-cover {
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: #fff;
      }
      .book-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }
      .book:hover .book-cover img {
        transform: scale(1.07);
      }
      .book-body {
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .book-title {
        font-weight: 800;
        font-size: 14.5px;
        line-height: 1.25;
        font-family: "Baloo 2", sans-serif;
      }
      .book-author {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: -4px;
      }
      .book-blurb {
        font-size: 12.5px;
        color: var(--ink-soft);
        line-height: 1.4;
        flex: 1;
      }
      .book-age {
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-soft);
        background: rgba(0, 0, 0, 0.05);
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        width: fit-content;
      }
      .borrow-btn {
        border: none;
        cursor: pointer;
        margin-top: 4px;
        padding: 9px;
        border-radius: 8px;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: 13.5px;
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }
      .borrow-btn.available:hover,
      .return-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
      }
      .borrow-btn:active,
      .return-btn:active {
        transform: translateY(1px);
      }
      .borrow-btn.available {
        background: var(--leaf);
        color: #fff;
      }
      .borrow-btn.borrowed {
        background: rgba(0, 0, 0, 0.08);
        color: var(--ink-soft);
        cursor: default;
      }

      .empty-state {
        text-align: center;
        padding: 40px 10px;
        color: var(--ink-soft);
      }
      .empty-state div {
        font-size: 38px;
        margin-bottom: 8px;
      }

      footer {
        text-align: center;
        color: var(--ink-soft);
        font-size: 12.5px;
        padding: 10px 20px 30px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 40, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }
      .modal-overlay.hidden {
        display: none;
      }
      .modal-box {
        background: var(--bg-2);
        border-radius: var(--radius);
        padding: 22px 22px 20px;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 12px 0 rgba(0, 0, 0, 0.12);
        max-height: 88vh;
        overflow-y: auto;
      }
      .modal-box h3 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .modal-box .modal-sub {
        font-size: 13px;
        color: var(--ink-soft);
        margin: 0 0 14px;
      }
      .loan-details {
        display: grid;
        gap: 2px;
        margin-top: 3px;
        color: var(--ink-soft);
        font-size: 12px;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1.5px solid rgba(0, 0, 0, 0.12);
        font-family: "Nunito", sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--ink);
      }
      .field textarea {
        resize: vertical;
        min-height: 56px;
      }
      .file-hint {
        display: block;
        color: var(--ink-soft);
        font-size: 11.5px;
        margin-top: 5px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .btn-primary,
      .btn-secondary {
        flex: 1;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        font-family: "Nunito", sans-serif;
      }
      .btn-primary {
        background: var(--sky);
        color: #fff;
      }
      .btn-secondary {
        background: rgba(0, 0, 0, 0.07);
        color: var(--ink-soft);
      }
      .login-error {
        color: var(--coral);
        font-size: 13px;
        font-weight: 700;
        margin: 4px 0 0;
        min-height: 16px;
      }
      .history-list {
        display: grid;
        gap: 10px;
      }
      .history-item {
        padding: 13px 14px;
        border: 1px solid rgba(62, 142, 237, 0.12);
        border-radius: 12px;
        background: rgba(62, 142, 237, 0.045);
        box-shadow: 0 3px 0 rgba(62, 142, 237, 0.07);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .history-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 rgba(62, 142, 237, 0.1);
      }
      .history-title {
        font-weight: 800;
        font-size: 14.5px;
      }
      .history-details {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        color: var(--ink-soft);
        font-size: 12.5px;
        margin-top: 8px;
      }
      .history-details span:not(.history-status) {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
      }
      .history-status {
        color: var(--leaf);
        font-weight: 800;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(63, 168, 117, 0.13);
      }
      @media (max-width: 560px) {
        .history-details {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .history-status {
          width: fit-content;
        }
      }

      .book {
        position: relative;
      }
      .book-delete {
        position: absolute;
        top: 6px;
        right: 6px;
        border: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .book-delete:hover {
        transform: scale(1.05);
        background: var(--coral);
      }

      @keyframes page-enter {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes logo-enter {
        from {
          opacity: 0;
          transform: translateY(-12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes content-enter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes hero-decor {
        from {
          transform: translateX(0) rotate(-2deg);
        }
        to {
          transform: translateX(-18px) rotate(2deg);
        }
      }
      @keyframes book-enter {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .book:nth-child(2) {
        animation-delay: 0.05s;
      }
      .book:nth-child(3) {
        animation-delay: 0.1s;
      }
      .book:nth-child(4) {
        animation-delay: 0.15s;
      }
      .book:nth-child(5) {
        animation-delay: 0.2s;
      }
      .book:nth-child(6) {
        animation-delay: 0.25s;
      }
      .book:nth-child(7) {
        animation-delay: 0.3s;
      }
      .book:nth-child(8) {
        animation-delay: 0.35s;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition: none;
        }
        .book:hover,
        .search-box:focus-within {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <img
          class="brand-logo"
          src="logo%20perpustakaan.png"
          alt="Logo perpustakaan anak"
        />
        <h1>Rak Ceria 🌈</h1>
        <p>
          Perpustakaan online untuk anak-anak. Pilih buku, pinjam gratis, baca
          sepuasnya — mudah dan menyenangkan!
        </p>
        <span class="hero-badge" id="stockBadge">Memuat rak buku…</span>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div class="search-box">
          <span>🔎</span>
          <input
            id="searchInput"
            type="text"
            placeholder="Cari judul atau penulis buku..."
          />
        </div>
      </div>
      <div class="toolbar chips" id="categoryChips"></div>

      <section class="shelf-section">
        <div class="shelf-title" id="shelfTitle">🪄 Semua Buku</div>
        <div class="grid" id="bookGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none">
          <div>🙈</div>
          Buku tidak ditemukan. Coba kata lain, ya!
        </div>
      </section>

      <footer>
        Dibuat untuk membantu anak-anak gemar membaca. Data buku tersimpan
        di Firebase Firestore 🎉
      </footer>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      // Firebase yang sama dengan project admin Rak Ceria.
      const firebaseConfig = {
        apiKey: "AIzaSyDcXnrpUG6uEVlt5WhMmGEBqq4L9JrUvMA",
        authDomain: "tutorial-firebase-d6f84.firebaseapp.com",
        databaseURL: "https://tutorial-firebase-d6f84-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tutorial-firebase-d6f84",
        storageBucket: "tutorial-firebase-d6f84.firebasestorage.app",
        messagingSenderId: "150536235891",
        appId: "1:150536235891:web:9166b1ba3253776e197306"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let books = [];
      let state = { search: "", category: "Semua" };

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function categories() {
        return ["Semua", ...Array.from(new Set(books.map((b) => b.cat).filter(Boolean)))];
      }

      function renderChips() {
        const wrap = document.getElementById("categoryChips");
        wrap.innerHTML = "";
        categories().forEach((cat) => {
          const btn = document.createElement("button");
          btn.className = "chip" + (state.category === cat ? " active" : "");
          btn.textContent = cat;
          btn.onclick = () => {
            state.category = cat;
            render();
          };
          wrap.appendChild(btn);
        });
      }

      function renderGrid() {
        const grid = document.getElementById("bookGrid");
        const empty = document.getElementById("emptyState");
        grid.innerHTML = "";

        const q = state.search.trim().toLowerCase();
        const filtered = books.filter((b) => {
          const title = String(b.title || "").toLowerCase();
          const author = String(b.author || "").toLowerCase();
          const cat = String(b.cat || "");
          const matchCat = state.category === "Semua" || cat === state.category;
          const matchQ = !q || title.includes(q) || author.includes(q);
          return matchCat && matchQ;
        });

        document.getElementById("shelfTitle").textContent =
          state.category === "Semua"
            ? "🪄 Semua Buku"
            : `🪄 Kategori: ${state.category}`;

        if (filtered.length === 0) {
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";

        filtered.forEach((book) => {
          const card = document.createElement("div");
          card.className = "book";
          const title = escapeHtml(book.title || "Tanpa Judul");
          const author = escapeHtml(book.author || "Tidak diketahui");
          const age = escapeHtml(book.age || "");
          const blurb = escapeHtml(book.blurb || "");
          const icon = escapeHtml(book.icon || "📚");
          const color = escapeHtml(book.color || "var(--sky)");
          const cover = book.cover ? String(book.cover) : "";

          card.innerHTML = `
            <div class="book-cover" style="background:${color};">
              ${cover
                ? `<img src="${escapeHtml(cover)}" alt="Sampul ${title}" onerror="this.style.display='none'; this.parentElement.textContent='${icon}'">`
                : icon}
            </div>
            <div class="book-body">
              <div class="book-title">${title}</div>
              <div class="book-author">oleh ${author}</div>
              ${age ? `<div class="book-age">${age}</div>` : ""}
              <div class="book-blurb">${blurb}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function renderBadge() {
        const total = books.length;
        document.getElementById("stockBadge").textContent =
          `${total} judul tersedia · tersinkron dengan database`;
      }

      function render() {
        renderChips();
        renderGrid();
        renderBadge();
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        state.search = e.target.value;
        renderGrid();
      });

      function startFirestoreListener() {
        db.collection("books")
          .onSnapshot(
            (snapshot) => {
              books = snapshot.docs.map((doc) => ({
                id: doc.id,
                ...doc.data(),
              }));

              books.sort((a, b) =>
                String(a.title || "").localeCompare(String(b.title || ""), "id")
              );

              if (!categories().includes(state.category)) {
                state.category = "Semua";
              }

              render();
            },
            (error) => {
              console.error("Firestore error:", error);
              books = [];
              state.category = "Semua";
              render();
              document.getElementById("stockBadge").textContent =
                "Gagal memuat rak buku";
              document.getElementById("emptyState").style.display = "block";
              document.getElementById("emptyState").innerHTML =
                `<div>⚠️</div>Gagal mengambil data buku dari Firebase.`;
            }
          );
      }

      // Tidak ada DEFAULT_BOOKS dan tidak ada localStorage untuk daftar buku.
      // Firestore menjadi satu-satunya sumber data pada halaman publik.
      startFirestoreListener();
    </script>
  </body>
</html>
